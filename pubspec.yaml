name: hotel_booking
description: "Flutter Hotel Booking App with Supabase & Midtrans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  flutter_bloc: ^8.1.5
  go_router: ^14.0.0
  webview_flutter: ^4.7.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  equatable: ^2.0.5
  get_it: ^7.7.0
  google_sign_in: ^6.2.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  json_annotation: ^4.9.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
