name: hotel_booking
description: "Flutter Hotel Booking App with Supabase & Midtrans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  flutter_bloc: ^8.1.5
  go_router: ^14.0.0
  webview_flutter: ^4.7.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  equatable: ^2.0.5
  get_it: ^7.7.0
  google_sign_in: ^6.2.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  json_annotation: ^4.9.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10
  smooth_page_indicator: ^1.1.0
  http: ^1.6.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.2
  geolocator: ^14.0.3
  pdf: ^3.12.0
  printing: ^5.14.3
  mobile_scanner: ^7.4.0
  permission_handler: ^12.0.0
  flutter_dotenv: ^5.1.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logorunhotel.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icons/logorunhotel_splash.png"
  android: true
  ios: true
  android_12:
    image: "assets/icons/logorunhotel_splash.png"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env
